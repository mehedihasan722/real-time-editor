
services:
  web:
    build:
      context: .
      target: development
    env_file:
      - ./apps/web/.env.local
    ports:
      - "127.0.0.1:${FLOWBOARD_DOCKER_PORT:-3031}:3030"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/apps/web/.next
    command: npm run dev --workspace=@flowboard/web -- --hostname 0.0.0.0
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3030/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  node_modules:
  next_cache:
