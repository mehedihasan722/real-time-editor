services:
  web:
    build:
      context: .
      target: development
    env_file:
      - .env.local
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/apps/web/.next
    command: npm run dev
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  node_modules:
  next_cache:
