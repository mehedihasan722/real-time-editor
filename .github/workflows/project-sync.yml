name: Sync issues to project

on:
  issues:
    types: [opened, reopened]
  pull_request:
    types: [opened, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - name: Check Projects configuration
        id: configuration
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PROJECT_URL: ${{ vars.PROJECT_URL }}
        run: |
          if [[ -n "$PROJECT_TOKEN" && -n "$PROJECT_URL" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Configure PROJECT_TOKEN with Projects write access and PROJECT_URL to enable issue/PR project sync." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/add-to-project@f2c1f1fa649a891be84948ea89b5dfba1526ef05 # v2.0.1
        if: steps.configuration.outputs.ready == 'true' && github.event_name != 'workflow_dispatch'
        with:
          project-url: ${{ vars.PROJECT_URL }}
          github-token: ${{ secrets.PROJECT_TOKEN }}
