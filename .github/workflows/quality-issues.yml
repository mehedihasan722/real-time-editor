name: Track build failures

on:
  workflow_run:
    workflows: [Quality]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  issues: write

concurrency:
  group: quality-failure-issue
  cancel-in-progress: false

jobs:
  track:
    if: github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const run = context.payload.workflow_run;
            if (!['success', 'failure', 'timed_out'].includes(run.conclusion)) return;
            const latest = await github.rest.repos.getBranch({ ...context.repo, branch: 'main' });
            if (latest.data.commit.sha !== run.head_sha) return;
            const title = '🚨 Production quality checks failing';
            const issues = await github.paginate(github.rest.issues.listForRepo, { ...context.repo, state: 'open', creator: 'github-actions[bot]' });
            const issue = issues.find(item => item.title === title && !item.pull_request);
            if (run.conclusion === 'success') {
              if (issue) await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: 'closed' });
              return;
            }
            const body = `Quality checks failed for ${run.head_sha}.\n\n[Inspect the workflow run](${run.html_url}) and fix the failing check. This issue closes automatically when main passes again.`;
            if (issue) await github.rest.issues.update({ ...context.repo, issue_number: issue.number, body });
            else await github.rest.issues.create({ ...context.repo, title, body, labels: ['bug'] });
